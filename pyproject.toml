[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "trader"
version = "2026.10.26"
description = "Download and process data for Stock Markets"
readme = "README.rst"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Aditya", email = "code.aditya@gmail.com"},
]
dependencies = [
]
keywords = ["nse", "stocks", "bhavcopy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/codeaditya/trader"
Repository = "https://github.com/codeaditya/trader"
Issues = "https://github.com/codeaditya/trader/issues"

[tool.hatch.build.targets.wheel]
only-include = ["trader.py"]

# ... other project metadata fields as listed in:
#     https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
